name: SigmaWatch

options:
  deploymentTarget:
    watchOS: "26.0"

packages:
  SigmaMusicKit:
    path: ..

targets:
  SigmaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    dependencies:
      - package: SigmaMusicKit
        product: SigmaMusicKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sigma
        WKApplication: true
        WKWatchOnly: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zis30axs.diymusicplayer.watch
        PRODUCT_NAME: SigmaWatch
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 4
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
