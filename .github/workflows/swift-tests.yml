name: Swift tests

on:
  push:
    branches:
      - main
      - port/m1-foundation
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test SigmaMusicKit
        run: swift test
