name: Swift tests

on:
  push:
    branches:
      - main
      - "port/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test SigmaMusicKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      # The raw log needs a browser login; annotations are readable through the API.
      - name: Summarize results
        if: always()
        run: |
          msg=$(grep -E "error:|Issue recorded|✘|Test run with|Executed [0-9]+ tests|Build complete|warning:.*Sources" test.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::notice title=swift test summary::${msg}"
