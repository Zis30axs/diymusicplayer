name: WatchProbe

options:
  deploymentTarget:
    watchOS: "11.0"

targets:
  WatchProbe:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DIY Music Probe
        WKApplication: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zis30axs.diymusicplayer.watchprobe
        PRODUCT_NAME: WatchProbe
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 4
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
